<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Smart Academic Data Cleaning Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-panel fade-up">
      <a class="brand" href="index.html">
        <span class="brand-mark">SD</span>
        <span>Smart Data Portal</span>
      </a>
      <h1>Reset Password</h1>
      <p>Enter your account email or real name and choose a new password to reset your login.</p>

      <form class="auth-form" data-forgot-password-form action="signin.html" method="get">
        <label for="reset-identifier">Email or Name</label>
        <input id="reset-identifier" name="identifier" type="text" placeholder="you@university.edu or Alex Carter" required />

        <label for="reset-password">New Password</label>
        <input id="reset-password" name="password" type="password" placeholder="Enter your new password" required />

        <label for="reset-confirm-password">Confirm New Password</label>
        <input id="reset-confirm-password" name="confirm-password" type="password" placeholder="Re-enter your new password" required />

        <button class="btn btn-solid" type="submit">Reset Password</button>
      </form>

      <p class="switch-link">Remembered your password? <a href="signin.html">Back to login</a></p>
    </section>
  </main>
  <script src="assets/main.js"></script>
</body>
</html>
